<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kexpres - transport • logistic • spedition</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        /* Horná lišta / Navigácia */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .logo {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff6b00; /* Oranžová pre Expres */
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 20px;
            border: 2px solid #ff6b00;
            border-radius: 5px;
            background: rgba(255, 107, 0, 0.2);
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: #ff6b00;
            color: #ffffff;
        }

        /* Hlavná sekcia s foto pozadím */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), 
                        url('kamion.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            color: #ffffff;
            font-size: 42px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* Prispôsobenie pre mobilné zariadenia */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .logo {
                font-size: 22px;
            }
            nav a {
                font-size: 13px;
                padding: 8px 12px;
            }
            .hero h1 {
                font-size: 22px;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>

    <!-- Horná lišta -->
    <header>
        <div class="logo">K<span>expres</span></div>
        <nav>
            <a href="prepravny-poriadok.pdf" target="_blank">Prepravný poriadok</a>
        </nav>
    </header>

    <!-- Hlavné pozadie a slogan -->
    <section class="hero">
        <h1>transport • logistic • spedition</h1>
    </section>

</body>
</html>
